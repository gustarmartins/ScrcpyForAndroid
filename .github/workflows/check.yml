name: Compile and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-31' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew :app:assembleScrcpyDebug :app:testScrcpyDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mekki-mirror-debug
          path: app/build/outputs/apk/scrcpy/debug/*.apk
          retention-days: 14
